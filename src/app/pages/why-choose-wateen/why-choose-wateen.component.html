<section class="wcw-hero">
  <div
    class="hero-bg"
    style="background-image: url('assets/images/why-choose/Why-Choose-Wateen.jpg')"
  ></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Why <span>Choose</span> Wateen</h1>
  </div>
</section>

<section class="wcw-cards">
  <div class="container cards-grid">
    @for (card of cards; track card.title) {
      <article class="card">
        <div class="card-icon">
          <img [src]="card.icon" [alt]="card.title" />
        </div>
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
      </article>
    }
  </div>
</section>
