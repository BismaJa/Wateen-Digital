<section class="wwa-hero">
  <div
    class="hero-bg"
    style="background-image: url('assets/images/who-we-are/About-Us.jpg')"
  ></div>
  <div class="hero-overlay"></div>
  <div
    class="hero-content"
    [appAnim]="'left-t-right'"
    [animDelay]="200"
    [animSpeed]="600"
  >
    <h1><span>Who</span> We Are</h1>
  </div>
</section>

<section class="wwa-about">
  <div class="container about-grid">
    <div class="about-copy">
      <p [appAnim]="'left-t-right'" [animDelay]="200" [animSpeed]="600">
        <span class="highlight">Wateen Digital Solutions LLC.,</span> {{ introRest }}
      </p>
      @for (p of paragraphs; track $index) {
        <p [appAnim]="'left-t-right'" [animDelay]="350 + $index * 150" [animSpeed]="600">{{ p }}</p>
      }
    </div>
    <div class="about-media" [appAnim]="'right-t-left'" [animDelay]="200" [animSpeed]="800">
      <img
        src="assets/images/who-we-are/who-we-are-shape.png"
        alt="Wateen Digital Solutions team"
      />
    </div>
  </div>
</section>

<section class="wwa-how">
  <div class="container how-grid">
    <div class="how-copy">
      <p class="eyebrow" [appAnim]="'left-t-right'" [animDelay]="100" [animSpeed]="600">HOW WE WORK</p>
      <h2 [appAnim]="'left-t-right'" [animDelay]="250" [animSpeed]="600">
        Embark on a seamless journey with Wateen Digital Solutions:
      </h2>
      <p [appAnim]="'left-t-right'" [animDelay]="400" [animSpeed]="600">
        {{ howWeWork }}
      </p>
    </div>
    <div class="how-media" [appAnim]="'right-t-left'" [animDelay]="200" [animSpeed]="800">
      <img
        src="assets/images/who-we-are/line-art.png"
        alt="How we work illustration"
      />
    </div>
  </div>
</section>
