<section class="telecom-hero" id="telecom-hero">
  <div
    class="hero-bg"
    style="background-image: url('assets/images/telecom/Telecom-Services.jpg')"
  ></div>
  <div class="hero-overlay"></div>
  <div
    class="hero-content"
    [appAnim]="'left-t-right'"
    [animDelay]="600"
    [animSpeed]="500"
  >
    <h1><span>Telecom</span> Expertise</h1>
  </div>
</section>

<section class="telecom-banner" id="telecom-overview">
  <p [appAnim]="'right-t-left'" [animDelay]="1200" [animSpeed]="600">
    The Company and its affiliated entities have been in this business for the past two decades,
    with an extensive experience in planning, designing, deploying and managing over 42,000 KMs of
    fiber network.
  </p>
</section>

<section class="telecom-body" id="telecom-services">
  <div class="container body-grid">
    <div class="service-list">
      @for (item of services; track item; let si = $index) {
        <div
          class="service-item"
          [appAnim]="'left-t-right'"
          [animDelay]="300 + si * 150"
          [animSpeed]="600"
        >
          <svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.6 3.4L13.5 4.5" /></svg>
          <span>{{ item }}</span>
        </div>
      }
    </div>
    <div class="feature-media" [appAnim]="'right-t-left'" [animDelay]="200" [animSpeed]="800">
      <img
        src="assets/images/telecom/Optical-Fiber-Network.png"
        alt="Optical fiber network infrastructure"
      />
    </div>
  </div>
</section>
